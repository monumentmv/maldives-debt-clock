name: Probe Ministry of Finance debt files (one-off, branch only)
on:
  push:
    branches: [claude/focused-cori-qvem0w]
    paths: [tools/probe_mof.py, .github/workflows/probe-mof.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - run: python tools/probe_mof.py
