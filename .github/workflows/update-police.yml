name: Update police figures

# Police case counts change through the day, so this light job reads just the current year
# every 30 minutes and rebuilds the two pages that show them. The full daily job
# (update-data.yml) still reads the last two years and rebuilds the master dataset each morning.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  police:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python fetch_police.py --years $(date -u +%Y)
      - run: |
          python build_priorities.py
          python build_protection.py
      - name: Commit if changed
        run: |
          git config user.name "debt-clock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/police/crime_monthly.csv priorities.json protection.json
          git diff --cached --quiet || (git commit -m "Update police figures $(date -u +'%F %H:%M')" && git pull --rebase --autostash -X theirs && git push)
