name: Update Hulhulé weather
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [fetch_weather.py, .github/workflows/update-weather.yml]
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python fetch_weather.py
      - name: Commit current weather
        run: |
          git config user.name 'debt-clock-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add weather.json
          git diff --cached --quiet || (git commit -m 'Update Hulhulé weather' && git pull --rebase && git push)
