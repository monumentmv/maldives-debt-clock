name: Update debt data

on:
  schedule:
    - cron: "0 3,7,11,15 * * *"   # 08:00, 12:00, 16:00 and 20:00 Malé time, so a new weekly report is picked up the same day
  workflow_dispatch:
  push:
    branches: [main]
    paths: [fetch_data.py, fetch_mira.py, build_revenue.py, fetch_wfd.py, wfd_extract.py, fetch_police.py, fetch_lenders.py, fetch_bulletin.py, build_lenders.py, build_priorities.py, build_protection.py, build_master.py, build_share.py, tools/share-card.html, "inputs/**", .github/workflows/update-data.yml]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl pdfplumber playwright
      - run: python -m playwright install --with-deps chromium
      - run: python fetch_data.py
        env:
          MMA_TOKEN: ${{ secrets.MMA_TOKEN }}
      - name: New MIRA revenue files
        if: always()
        run: python fetch_mira.py
      - name: Build revenue data from MIRA files
        if: always()
        run: python build_revenue.py
      - name: Weekly budget figures from the Ministry of Finance
        if: always()
        run: python fetch_wfd.py
      - name: Ministry of Finance loans and guarantees, and Quarterly Debt Bulletins
        if: always()
        run: |
          python fetch_lenders.py
          python fetch_bulletin.py
          python build_lenders.py
      - name: Crime statistics from the Maldives Police Service
        if: always()
        timeout-minutes: 45
        run: python fetch_police.py
      - name: Priorities and protection pages
        if: always()
        run: |
          python build_priorities.py
          python build_protection.py
      - name: Master dataset and downloads
        if: always()
        run: python build_master.py
      - name: Picture shown when the site is shared
        if: always()
        run: python build_share.py
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "debt-clock-bot"
          git config user.email "actions@users.noreply.github.com"
          for p in data.json revenue.json budget.json budget-detail assets/share.png priorities.json protection.json data/police data/wfd data/master inputs/mira lenders.json data/lenders data/bulletin inputs/mof inputs/imf; do if [ -e "$p" ]; then git add -A "$p"; fi; done
          git diff --cached --quiet || (git commit -m "Update data $(date -u +%F)" && git pull --rebase --autostash -X theirs && git push)
      - name: Publish the downloads
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f dist/maldives_public_finance.xlsx ]; then
            gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Latest data" --notes "Every series behind the Maldives National Debt Clock, rebuilt every morning. See https://mvdebtclock.org/data.html"
            gh release upload data-latest dist/maldives_public_finance.xlsx dist/maldives_public_finance_csv.zip --clobber
          fi
      - name: Warn if the weekly budget figures are out of date
        if: always()
        run: |
          python - <<'PY'
          import json, sys
          from datetime import date
          latest = json.load(open("budget.json")).get("latest", "")[:10]
          days = (date.today() - date.fromisoformat(latest)).days if latest else 999
          print(f"Newest weekly report on the site is as at {latest}, {days} days ago.")
          if days > 12:
              sys.exit(f"The newest weekly report on the site is {days} days old. Ministry of Finance has probably published a newer one that wasn't picked up. Check the 'Weekly budget figures' step above.")
          PY
