name: Update debt data

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 08:00 Malé time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [fetch_data.py, .github/workflows/update-data.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch_data.py
        env:
          MMA_TOKEN: ${{ secrets.MMA_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "debt-clock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update data $(date -u +%F)" && git push)
